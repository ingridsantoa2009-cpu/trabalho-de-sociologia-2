<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Museu Virtual | Memória e História</title>
  <meta name="description" content="Explore um museu virtual dedicado à preservação da memória e da história.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      font-family: 'Montserrat', sans-serif;
      background:
        linear-gradient(rgba(8, 13, 20, 0.78), rgba(8, 13, 20, 0.88)),
        url('https://images.unsplash.com/photo-1561214115-f2f134cc4912?auto=format&fit=crop&w=2000&q=85');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #f4eee3;
    }

    /* Partículas */
    #particles {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Cabeçalho */
    header {
      width: 100%;
      padding: 28px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(215, 183, 128, 0.2);
    }

    .logo {
      font-family: 'Cinzel', serif;
      font-size: 19px;
      letter-spacing: 4px;
      color: #d7b780;
    }

    nav {
      display: flex;
      gap: 35px;
    }

    nav a {
      text-decoration: none;
      color: #eee7dc;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: 0.3s;
    }

    nav a:hover {
      color: #d7b780;
    }

    /* Conteúdo principal */
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 70px 20px;
    }

    .hero {
      max-width: 850px;
      animation: aparecer 1.5s ease;
    }

    .museum-symbol {
      width: 145px;
      height: 145px;
      border-radius: 50%;
      border: 1px solid #d7b780;
      padding: 7px;
      margin: 0 auto 35px;
      box-shadow: 0 0 35px rgba(215, 183, 128, 0.15);
    }

    .museum-symbol img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .eyebrow {
      color: #d7b780;
      font-size: 11px;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(38px, 7vw, 76px);
      font-weight: 400;
      letter-spacing: 5px;
      line-height: 1.2;
      margin-bottom: 22px;
      color: #f5eee2;
    }

    .subtitle {
      font-size: 14px;
      line-height: 2;
      font-weight: 300;
      letter-spacing: 1px;
      color: #d1c9bc;
      max-width: 600px;
      margin: 0 auto 42px;
    }

    .divider {
      width: 65px;
      height: 1px;
      background: #d7b780;
      margin: 0 auto 35px;
    }

    /* Botão */
    .enter-button {
      display: inline-block;
      padding: 17px 42px;
      border: 1px solid #d7b780;
      color: #e8d4ae;
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 3px;
      transition: 0.4s;
      background: rgba(215, 183, 128, 0.04);
    }

    .enter-button:hover {
      background: #d7b780;
      color: #111820;
      box-shadow: 0 0 25px rgba(215, 183, 128, 0.25);
    }
